<body style=margin:0;background:#000;touch-action:none><canvas id=c><script>
Z=()=>{W=innerWidth;H=innerHeight;c.width=W;c.height=H};Z();g=c.getContext('2d');
T=0;tx=0;ty=0;hu=25;pu=0;A=null;
S=[];for(i=0;i<250;i++)S.push([Math.random(),Math.random(),Math.random()]);
D=[];for(i=0;i<240;i++)D.push([Math.random()*7,1.25+Math.random()*1.7,.004+Math.random()*.014]);
function be(f){try{A=A||new AudioContext();A.resume();o=A.createOscillator();v=A.createGain();o.connect(v);v.connect(A.destination);o.type='sawtooth';o.frequency.value=f;v.gain.setValueAtTime(.12,A.currentTime);v.gain.exponentialRampToValueAtTime(.001,A.currentTime+.25);o.start();o.stop(A.currentTime+.25)}catch(e){}}
K=[0,1,0,2,0,4,1,3,1,5,2,3,2,6,3,7,4,5,4,6,5,7,6,7];
V=i=>{x=i&1?R:-R;y=i&2?R:-R;z=i&4?R:-R;a=x*co+z*si;b=z*co-x*si;e=y*CO-b*SI;f=b*CO+y*SI;p=3*R/(3*R+f);return[CX+a*p,CY+e*p]};
onresize=Z;
onpointermove=e=>{tx=e.clientX/W-.5;ty=e.clientY/H-.5};
onpointerdown=e=>{tx=e.clientX/W-.5;ty=e.clientY/H-.5;hu+=40;pu=1;be(80+Math.random()*200)};
onkeydown=e=>{hu+=25;pu=1;be(60+e.keyCode*6)};
(function L(){requestAnimationFrame(L);T+=.01+Math.hypot(tx,ty)*.03;CX=W/2+tx*70;CY=H/2+ty*70;R=Math.min(W,H)*.11;g.fillStyle='#000';g.fillRect(0,0,W,H);
for(s of S){X=s[0]*W;Y=s[1]*H;dx=X-CX;dy=Y-CY;d=Math.hypot(dx,dy)+1;k=R*R*2/d/d;X+=dx/d*k*8;Y+=dy/d*k*8;g.fillStyle='rgba(255,255,255,'+(.3+s[2]*.7*Math.abs(Math.sin(T*2+s[0]*9)))+')';g.fillRect(X,Y,s[2]*2+1,s[2]*2+1)}
function disk(f){for(d of D){d[0]+=d[2];r=d[1]*R;n=Math.sin(d[0]);m=Math.cos(d[0]);x=m*r;y=n*r*.36-m*3;X=CX+x;Y=CY+y;if((n>0)!=f)continue;sp=(x/r+1)/2;g.fillStyle='hsl('+(hu+sp*45)+',100%,'+(45+sp*20)+'%)';w=4-2*d[1]/3;g.globalAlpha=.35+sp*.65;g.fillRect(X,Y,w+2,w*.8+1)}g.globalAlpha=1}
disk(0);
gr=g.createRadialGradient(CX,CY,R*.7,CX,CY,R*2.6);gr.addColorStop(0,'rgba(0,0,0,1)');gr.addColorStop(.5,'rgba(255,140,0,.35)');gr.addColorStop(.6,'rgba(255,220,150,.9)');gr.addColorStop(.68,'rgba(0,0,0,1)');g.fillStyle=gr;g.beginPath();g.arc(CX,CY,R*2.6,0,7);g.fill();
g.fillStyle='#000';g.beginPath();g.arc(CX,CY,R,0,7);g.fill();g.strokeStyle='hsl('+(hu+45)+',100%,75%)';g.lineWidth=2;g.shadowColor='#ffb84d';g.shadowBlur=18;g.beginPath();g.arc(CX,CY,R+1.5,0,7);g.stroke();g.shadowBlur=0;
disk(1);
if(pu>0){g.strokeStyle='hsla('+hu+',100%,65%,'+pu+')';g.lineWidth=2;g.beginPath();g.arc(CX,CY,R+10+(1-pu)*120,0,7);g.stroke();pu-=.02}
co=Math.cos(T);si=Math.sin(T);CO=Math.cos(T*.7);SI=Math.sin(T*.7);g.strokeStyle='hsl('+hu+',100%,70%)';g.lineWidth=1;g.globalAlpha=.8;g.beginPath();for(j=0;j<24;j+=2){U=V(K[j]);J=V(K[j+1]);g.moveTo(U[0],U[1]);g.lineTo(J[0],J[1])}g.stroke();g.globalAlpha=1})()
</script>
